name: Deony Production Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run

      - name: Build frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}

      - name: Deploy CDK Infrastructure
        working-directory: ./infra
        run: |
          npm ci
          npx cdk deploy --require-approval never --all

      - name: Deploy Web Assets to S3 & Invalidate CloudFront
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name DeonyStack --query "Stacks[0].Outputs[?OutputKey=='WebBucketName' || OutputKey=='FrontendBucketName'].OutputValue" --output text || echo "")
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name DeonyStack --query "Stacks[0].Outputs[?OutputKey=='DistributionId' || OutputKey=='CloudFrontDistributionId'].OutputValue" --output text || echo "")
          
          if [ -n "$BUCKET_NAME" ]; then
            echo "Syncing dist/ to s3://$BUCKET_NAME..."
            aws s3 sync dist/ s3://$BUCKET_NAME --delete
          fi
          
          if [ -n "$DISTRIBUTION_ID" ]; then
            echo "Invalidating CloudFront cache for distribution $DISTRIBUTION_ID..."
            aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
          fi
