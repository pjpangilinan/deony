<body class="font-body-md text-body-md h-screen flex flex-col items-center justify-center relative overflow-hidden">

<!-- Nav is suppressed here as this is a focused "Log" task -->

<main class="z-10 w-full max-w-[800px] bg-surface rounded-xl border border-tertiary mx-gutter flex flex-col max-h-[90vh] overflow-hidden shadow-sm relative">
<!-- Header -->
<header class="flex justify-between items-center px-lg py-md border-b border-tertiary shrink-0 bg-surface">
<div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Log an Experience</h1>
<p class="font-caption text-caption text-secondary mt-xs">Step 2: Reflect &amp; Record</p>
</div>
<button aria-label="Close modal" class="text-secondary hover:text-primary transition-colors flex items-center justify-center rounded-full p-sm hover:bg-surface-variant focus:outline-none focus:ring-1 focus:ring-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</header>
<!-- Content Area -->
<div class="flex-1 overflow-y-auto p-lg flex flex-col md:flex-row gap-xl bg-surface-bright">
<!-- Left Column: Item Preview -->
<div class="md:w-1/3 flex flex-col shrink-0">
<div class="rounded-lg border border-tertiary overflow-hidden bg-white mb-md aspect-[2/3] relative group">

<button class="text-white text-caption font-caption hover:underline">Change Media</button>
</div>
</div>
<div class="flex flex-col gap-sm">
<span class="inline-block px-sm py-xs bg-surface-variant text-on-surface-variant font-label-md text-label-md uppercase rounded-full self-start tracking-widest text-[10px]">Film</span>
<h2 class="font-headline-md text-headline-md text-on-surface leading-tight">Solaris</h2>
<p class="font-body-md text-body-md text-secondary">Andrei Tarkovsky, 1972</p>
</div>
</div>
<!-- Right Column: Form -->
<form class="md:w-2/3 flex flex-col gap-lg">
<!-- Rating -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wide">Rating</label>
<div class="flex gap-sm items-center">
<!-- Simulated Star Rating -->
<div class="flex gap-xs text-primary cursor-pointer">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[28px] text-tertiary-fixed-dim" style="font-variation-settings: 'FILL' 0;">star</span>
</div>
<span class="font-body-md text-body-md text-secondary ml-sm">4.0</span>
</div>
</div>
<!-- Status & Dates -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wide" for="status">Status</label>
<div class="relative">
<select class="w-full appearance-none bg-transparent border-0 border-b border-tertiary rounded-none py-sm px-0 font-body-md text-body-md text-on-surface focus:ring-0 focus:border-primary cursor-pointer" id="status">
<option>Completed</option>
<option>In Progress</option>
<option>Abandoned</option>
</select>
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 pointer-events-none text-secondary">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wide">Date Completed</label>
<div class="relative">
<input class="w-full bg-transparent border-0 border-b border-tertiary rounded-none py-sm px-0 font-body-md text-body-md text-on-surface focus:ring-0 focus:border-primary cursor-text" type="date" value="2023-10-27"/>
</div>
</div>
</div>
<!-- Tags -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wide">Themes / Tags</label>
<div class="flex flex-wrap gap-sm items-center">
<span class="px-md py-sm bg-surface-variant text-on-surface-variant font-label-md text-label-md rounded-full flex items-center gap-xs cursor-pointer hover:bg-surface-dim transition-colors">
                            Philosophy <span class="material-symbols-outlined text-[16px]">close</span>
</span>
<span class="px-md py-sm bg-surface-variant text-on-surface-variant font-label-md text-label-md rounded-full flex items-center gap-xs cursor-pointer hover:bg-surface-dim transition-colors">
                            Isolation <span class="material-symbols-outlined text-[16px]">close</span>
</span>
<input class="bg-transparent border-0 border-b border-transparent hover:border-tertiary focus:border-primary focus:ring-0 py-sm px-sm font-body-md text-body-md text-on-surface w-32 placeholder:text-outline-variant transition-colors" placeholder="Add tag..." type="text"/>
</div>
</div>
<!-- Thoughts -->
<div class="flex flex-col gap-sm flex-1">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wide" for="thoughts">Personal Thoughts</label>
<div class="border border-tertiary rounded-md p-md bg-white flex-1 flex flex-col min-h-[200px] focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-shadow">
<!-- Fake Rich Text Toolbar -->
<div class="flex gap-md border-b border-surface-variant pb-sm mb-sm text-secondary">
<button class="hover:text-primary transition-colors" type="button"><span class="material-symbols-outlined text-[20px]">format_bold</span></button>
<button class="hover:text-primary transition-colors" type="button"><span class="material-symbols-outlined text-[20px]">format_italic</span></button>
<button class="hover:text-primary transition-colors" type="button"><span class="material-symbols-outlined text-[20px]">format_list_bulleted</span></button>
<button class="hover:text-primary transition-colors" type="button"><span class="material-symbols-outlined text-[20px]">format_quote</span></button>
</div>
<textarea class="w-full flex-1 resize-none bg-transparent border-0 p-0 font-body-lg text-body-lg text-on-surface focus:ring-0 placeholder:text-outline-variant leading-relaxed" id="thoughts" placeholder="Begin introspection..."></textarea>
</div>
</div>
</form>
</div>

<footer class="flex justify-between items-center px-lg py-md border-t border-tertiary shrink-0 bg-surface">
<button class="font-label-md text-label-md text-secondary hover:text-primary transition-colors px-md py-sm rounded-md hover:bg-surface-variant focus:outline-none focus:ring-1 focus:ring-primary" type="button">

<button class="font-label-md text-label-md text-on-surface-variant px-lg py-sm rounded-md border border-tertiary hover:bg-surface-variant transition-colors focus:outline-none focus:ring-1 focus:ring-primary" type="button">
                    Draft

<button class="font-label-md text-label-md bg-primary text-white px-xl py-sm rounded-md border border-primary hover:bg-primary-container hover:text-on-primary-container transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-surface" type="button">
                    Save Experience
                </button>
</div>
</footer>
