<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Deony - Choose your building blocks</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=EB+Garamond:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary": "#3d3c39",
                        "on-tertiary-container": "#c9c7c2",
                        "background": "#fff8f5",
                        "outline-variant": "#c0c8c9",
                        "on-secondary": "#ffffff",
                        "on-surface-variant": "#404849",
                        "on-primary-container": "#a2d0d8",
                        "surface-bright": "#fff8f5",
                        "surface-container-high": "#efe6e2",
                        "surface-container": "#f5ece8",
                        "primary-container": "#2d5a61",
                        "surface-dim": "#e1d8d4",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#f8efea",
                        "primary": "#114349",
                        "on-primary-fixed-variant": "#1f4d54",
                        "on-primary-fixed": "#001f24",
                        "inverse-surface": "#34302d",
                        "primary-fixed-dim": "#a1ced6",
                        "on-tertiary": "#ffffff",
                        "secondary": "#5e5e5d",
                        "surface-container-low": "#fbf2ed",
                        "on-secondary-container": "#626361",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-surface": "#1f1b18",
                        "surface-tint": "#39656c",
                        "secondary-container": "#e0dfde",
                        "on-secondary-fixed-variant": "#464746",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#e5e2dd",
                        "surface-variant": "#eae1dc",
                        "on-background": "#1f1b18",
                        "tertiary-fixed-dim": "#c9c6c1",
                        "surface": "#fff8f5",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#54534f",
                        "on-tertiary-fixed-variant": "#474743",
                        "on-tertiary-fixed": "#1c1c19",
                        "primary-fixed": "#bcebf3",
                        "inverse-primary": "#a1ced6",
                        "secondary-fixed-dim": "#c7c6c5",
                        "outline": "#71787a",
                        "on-secondary-fixed": "#1a1c1b",
                        "surface-container-highest": "#eae1dc",
                        "secondary-fixed": "#e3e2e0"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "lg": "24px",
                        "xs": "4px",
                        "gutter": "24px",
                        "xl": "48px",
                        "margin-mobile": "20px",
                        "md": "16px",
                        "xxl": "80px",
                        "sm": "8px",
                        "margin-desktop": "120px",
                        "unit": "4px"
                    },
                    fontFamily: {
                        "body-lg": ["Hanken Grotesk"],
                        "headline-lg": ["EB Garamond"],
                        "caption": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "label-md": ["Hanken Grotesk"],
                        "headline-md": ["EB Garamond"],
                        "headline-lg-mobile": ["EB Garamond"],
                        "display": ["EB Garamond"]
                    },
                    fontSize: {
                        "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
                        "headline-lg": ["32px", { lineHeight: "1.2", fontWeight: "500" }],
                        "caption": ["12px", { lineHeight: "1.4", fontWeight: "400" }],
                        "body-md": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
                        "label-md": ["14px", { lineHeight: "1.0", letterSpacing: "0.05em", fontWeight: "500" }],
                        "headline-md": ["24px", { lineHeight: "1.3", fontWeight: "500" }],
                        "headline-lg-mobile": ["28px", { lineHeight: "1.2", fontWeight: "500" }],
                        "display": ["48px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .category-card.selected {
            border-color: #114349; /* primary */
            background-color: #fff8f5; /* surface */
        }
        .category-card.selected .icon-wrapper {
            background-color: #114349;
            color: #ffffff;
        }
        .category-card {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-background text-on-background h-full font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Transactional/Linear View - No Navigation Shell -->
<div class="min-h-full flex flex-col items-center justify-center py-xxl px-gutter sm:px-margin-desktop">
<!-- Header Section -->
<div class="text-center w-full max-w-2xl mb-xl">
<h1 class="font-display text-display text-primary mb-md">Deony</h1>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-sm">Choose your building blocks.</h2>
<p class="font-body-lg text-body-lg text-secondary">Select the categories you'd like to include in your digital sanctuary. You can always adjust this later.</p>
</div>
<!-- Bento Grid / Categories -->
<div class="w-full max-w-3xl grid grid-cols-2 md:grid-cols-3 gap-md md:gap-lg mb-xxl">
<!-- Category: Movies -->
<button class="category-card group relative flex flex-col items-center justify-center p-xl border border-tertiary rounded-lg bg-surface hover:bg-surface-container-high focus:outline-none focus:ring-1 focus:ring-primary h-48" onclick="this.classList.toggle('selected')">
<div class="icon-wrapper w-16 h-16 rounded-full border border-tertiary flex items-center justify-center mb-md group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors duration-300">
<span class="material-symbols-outlined text-[32px]">movie</span>
</div>
<span class="font-label-md text-label-md text-on-surface tracking-wider">Movies</span>
</button>
<!-- Category: TV -->
<button class="category-card group relative flex flex-col items-center justify-center p-xl border border-tertiary rounded-lg bg-surface hover:bg-surface-container-high focus:outline-none focus:ring-1 focus:ring-primary h-48" onclick="this.classList.toggle('selected')">
<div class="icon-wrapper w-16 h-16 rounded-full border border-tertiary flex items-center justify-center mb-md group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors duration-300">
<span class="material-symbols-outlined text-[32px]">tv</span>
</div>
<span class="font-label-md text-label-md text-on-surface tracking-wider">TV</span>
</button>
<!-- Category: Books -->
<button class="category-card group relative flex flex-col items-center justify-center p-xl border border-tertiary rounded-lg bg-surface hover:bg-surface-container-high focus:outline-none focus:ring-1 focus:ring-primary h-48" onclick="this.classList.toggle('selected')">
<div class="icon-wrapper w-16 h-16 rounded-full border border-tertiary flex items-center justify-center mb-md group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors duration-300">
<span class="material-symbols-outlined text-[32px]">book</span>
</div>
<span class="font-label-md text-label-md text-on-surface tracking-wider">Books</span>
</button>
<!-- Category: Games -->
<button class="category-card group relative flex flex-col items-center justify-center p-xl border border-tertiary rounded-lg bg-surface hover:bg-surface-container-high focus:outline-none focus:ring-1 focus:ring-primary h-48" onclick="this.classList.toggle('selected')">
<div class="icon-wrapper w-16 h-16 rounded-full border border-tertiary flex items-center justify-center mb-md group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors duration-300">
<span class="material-symbols-outlined text-[32px]">sports_esports</span>
</div>
<span class="font-label-md text-label-md text-on-surface tracking-wider">Games</span>
</button>
<!-- Category: Albums -->
<button class="category-card group relative flex flex-col items-center justify-center p-xl border border-tertiary rounded-lg bg-surface hover:bg-surface-container-high focus:outline-none focus:ring-1 focus:ring-primary h-48" onclick="this.classList.toggle('selected')">
<div class="icon-wrapper w-16 h-16 rounded-full border border-tertiary flex items-center justify-center mb-md group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors duration-300">
<span class="material-symbols-outlined text-[32px]">album</span>
</div>
<span class="font-label-md text-label-md text-on-surface tracking-wider">Albums</span>
</button>
<!-- Category: Podcasts -->
<button class="category-card group relative flex flex-col items-center justify-center p-xl border border-tertiary rounded-lg bg-surface hover:bg-surface-container-high focus:outline-none focus:ring-1 focus:ring-primary h-48" onclick="this.classList.toggle('selected')">
<div class="icon-wrapper w-16 h-16 rounded-full border border-tertiary flex items-center justify-center mb-md group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors duration-300">
<span class="material-symbols-outlined text-[32px]">podcasts</span>
</div>
<span class="font-label-md text-label-md text-on-surface tracking-wider">Podcasts</span>
</button>
</div>
<!-- Action Area -->
<div class="w-full max-w-3xl flex flex-col items-center justify-center mt-auto">
<div class="flex items-center space-x-2 mb-lg">
<div class="w-2 h-2 rounded-full bg-tertiary-fixed-dim"></div>
<div class="w-2 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-tertiary-fixed-dim"></div>
</div>
<button class="w-full sm:w-auto min-w-[200px] px-lg py-md bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:bg-on-primary-fixed-variant transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary shadow-sm flex items-center justify-center gap-sm">
                Continue
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<button class="mt-md text-secondary hover:text-primary font-body-md text-body-md transition-colors bg-transparent border-none">
                Skip for now
            </button>
</div>
</div>
</body></html>
