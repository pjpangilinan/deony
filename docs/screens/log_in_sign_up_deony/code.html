<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Deony - Digital Sanctuary</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#3d3c39",
                        "on-tertiary-container": "#c9c7c2",
                        "background": "#fff8f5",
                        "outline-variant": "#c0c8c9",
                        "on-secondary": "#ffffff",
                        "on-surface-variant": "#404849",
                        "on-primary-container": "#a2d0d8",
                        "surface-bright": "#fff8f5",
                        "surface-container-high": "#efe6e2",
                        "surface-container": "#f5ece8",
                        "primary-container": "#2d5a61",
                        "surface-dim": "#e1d8d4",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#f8efea",
                        "primary": "#114349",
                        "on-primary-fixed-variant": "#1f4d54",
                        "on-primary-fixed": "#001f24",
                        "inverse-surface": "#34302d",
                        "primary-fixed-dim": "#a1ced6",
                        "on-tertiary": "#ffffff",
                        "secondary": "#5e5e5d",
                        "surface-container-low": "#fbf2ed",
                        "on-secondary-container": "#626361",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-surface": "#1f1b18",
                        "surface-tint": "#39656c",
                        "secondary-container": "#e0dfde",
                        "on-secondary-fixed-variant": "#464746",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#e5e2dd",
                        "surface-variant": "#eae1dc",
                        "on-background": "#1f1b18",
                        "tertiary-fixed-dim": "#c9c6c1",
                        "surface": "#fff8f5",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#54534f",
                        "on-tertiary-fixed-variant": "#474743",
                        "on-tertiary-fixed": "#1c1c19",
                        "primary-fixed": "#bcebf3",
                        "inverse-primary": "#a1ced6",
                        "secondary-fixed-dim": "#c7c6c5",
                        "outline": "#71787a",
                        "on-secondary-fixed": "#1a1c1b",
                        "surface-container-highest": "#eae1dc",
                        "secondary-fixed": "#e3e2e0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "xs": "4px",
                        "gutter": "24px",
                        "xl": "48px",
                        "margin-mobile": "20px",
                        "md": "16px",
                        "xxl": "80px",
                        "sm": "8px",
                        "margin-desktop": "120px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "body-lg": ["Hanken Grotesk"],
                        "headline-lg": ["EB Garamond"],
                        "caption": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "label-md": ["Hanken Grotesk"],
                        "headline-md": ["EB Garamond"],
                        "headline-lg-mobile": ["EB Garamond"],
                        "display": ["EB Garamond"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "caption": ["12px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "display": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .auth-tab-active {
            border-bottom: 2px solid theme('colors.primary');
            color: theme('colors.primary');
        }
        .auth-tab-inactive {
            color: theme('colors.secondary');
            border-bottom: 2px solid transparent;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-gutter font-body-md selection:bg-primary-container selection:text-on-primary-container">
<div class="w-full max-w-[480px]">
<!-- Brand Header -->
<div class="text-center mb-xl">
<h1 class="font-display text-display text-primary tracking-tight">Deony</h1>
<p class="font-body-md text-secondary mt-sm">Introspection through permanence.</p>
</div>
<!-- Auth Card -->
<div class="bg-surface-container-lowest border border-tertiary p-xl">
<!-- Tabs -->
<div class="flex mb-lg border-b border-surface-variant">
<button class="flex-1 pb-md font-label-md text-label-md text-center auth-tab-active hover:text-primary transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-inset" id="tab-login" onclick="switchTab('login')">
                    Log In
                </button>
<button class="flex-1 pb-md font-label-md text-label-md text-center auth-tab-inactive hover:text-primary transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-inset" id="tab-signup" onclick="switchTab('signup')">
                    Sign Up
                </button>
</div>
<!-- Login Form -->
<form class="space-y-lg animate-[fadeIn_0.3s_ease-out]" id="form-login">
<div>
<label class="sr-only" for="login-email">Email address</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-sm font-body-md text-on-surface placeholder:text-secondary transition-colors" id="login-email" placeholder="Email address" required="" type="email"/>
</div>
<div>
<label class="sr-only" for="login-password">Password</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-sm font-body-md text-on-surface placeholder:text-secondary transition-colors" id="login-password" placeholder="Password" required="" type="password"/>
</div>
<div class="flex justify-between items-center pt-sm">
<div class="flex items-center">
<input class="border-outline-variant text-primary focus:ring-primary rounded-sm h-4 w-4 bg-transparent cursor-pointer" id="remember" type="checkbox"/>
<label class="ml-sm font-caption text-caption text-secondary cursor-pointer" for="remember">Remember me</label>
</div>
<a class="font-caption text-caption text-secondary hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
<button class="w-full bg-primary text-on-primary py-md px-lg rounded-DEFAULT font-label-md text-label-md hover:bg-on-primary-fixed-variant transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="submit">
                    Enter Archive
                </button>
</form>
<!-- Sign Up Form (Initially Hidden) -->
<form class="space-y-lg hidden animate-[fadeIn_0.3s_ease-out]" id="form-signup">
<div>
<label class="sr-only" for="signup-username">Username</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-sm font-body-md text-on-surface placeholder:text-secondary transition-colors" id="signup-username" placeholder="Choose a username" required="" type="text"/>
</div>
<div>
<label class="sr-only" for="signup-email">Email address</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-sm font-body-md text-on-surface placeholder:text-secondary transition-colors" id="signup-email" placeholder="Email address" required="" type="email"/>
</div>
<div>
<label class="sr-only" for="signup-password">Password</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-sm font-body-md text-on-surface placeholder:text-secondary transition-colors" id="signup-password" placeholder="Create a password" required="" type="password"/>
</div>
<button class="w-full bg-primary text-on-primary py-md px-lg rounded-DEFAULT font-label-md text-label-md hover:bg-on-primary-fixed-variant transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 mt-md" type="submit">
                    Begin Journey
                </button>
<p class="font-caption text-caption text-secondary text-center mt-sm">By signing up, you agree to our <a class="underline hover:text-primary" href="#">Terms</a> and <a class="underline hover:text-primary" href="#">Privacy Policy</a>.</p>
</form>
<!-- Social Login -->
<div class="mt-xl pt-lg border-t border-surface-variant text-center">
<p class="font-caption text-caption text-secondary mb-md">Or continue with</p>
<div class="flex justify-center gap-md">
<button aria-label="Sign in with Google" class="w-12 h-12 rounded-full border border-tertiary flex items-center justify-center hover:bg-surface-variant transition-colors focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined text-on-surface" data-icon="account_circle">account_circle</span>
</button>
<button aria-label="Sign in with Apple" class="w-12 h-12 rounded-full border border-tertiary flex items-center justify-center hover:bg-surface-variant transition-colors focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined text-on-surface" data-icon="lock">lock</span>
</button>
</div>
</div>
</div>
</div>
<script>
        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const signupForm = document.getElementById('form-signup');
            const loginTab = document.getElementById('tab-login');
            const signupTab = document.getElementById('tab-signup');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                
                loginTab.classList.add('auth-tab-active');
                loginTab.classList.remove('auth-tab-inactive');
                
                signupTab.classList.add('auth-tab-inactive');
                signupTab.classList.remove('auth-tab-active');
            } else {
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                
                signupTab.classList.add('auth-tab-active');
                signupTab.classList.remove('auth-tab-inactive');
                
                loginTab.classList.add('auth-tab-inactive');
                loginTab.classList.remove('auth-tab-active');
            }
        }
    </script>
</body></html>
